services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: consent
      POSTGRES_PASSWORD: consent
      POSTGRES_DB: consent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is optional: the app ships with a DB-backed job scheduler.
  # Keep it here as the upgrade path for a BullMQ-based queue.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
